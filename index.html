<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NB-BT пульт</title>
<style>
 body{font-family:sans-serif;background:#111;color:#eee;margin:0;padding:12px}
 h3{margin:14px 0 6px}
 .g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
 button{padding:16px 4px;font-size:16px;border:0;border-radius:10px;background:#2a6;color:#fff}
 button.b{background:#c63} button.s{background:#357} button.x{background:#555}
 #con{width:100%;background:#36c;font-size:18px}
 #log{white-space:pre-wrap;background:#000;color:#8f8;height:180px;overflow:auto;font:12px monospace;padding:6px;margin-top:10px;border-radius:8px}
 input{width:100%;box-sizing:border-box;padding:12px;font-size:16px;border-radius:8px;border:0;margin-top:8px}
</style></head><body>
<button id="con">Подключиться к NB-BT</button>
<h3>Светодиоды</h3>
<div class="g">
 <button data-c="L1">L1</button><button data-c="L2">L2</button>
 <button data-c="L3">L3</button><button data-c="L4">L4</button>
 <button data-c="LA=1" class="s">Все ВКЛ</button><button data-c="LA=0" class="x">Все ВЫКЛ</button>
 <button data-c="RUN" class="s">Бегущий</button><button data-c="INV" class="x">Инверсия</button>
</div>
<h3>Буззер</h3>
<div class="g">
 <button data-c="BEEP" class="b">Пик</button><button data-c="B=1000,400" class="b">1 кГц</button>
 <button data-c="B=4000,400" class="b">4 кГц</button><button data-c="BOFF" class="x">Тихо</button>
 <button data-c="BON" class="b">Тон</button><button data-c="BDC=1" class="b">DC вкл</button>
 <button data-c="BDC=0" class="x">DC выкл</button><button data-c="?" class="s">Статус</button>
</div>
<h3>Линии UART (транзисторы)</h3>
<div class="g">
 <button data-c="P15=0" class="s">P15=0</button><button data-c="P15=1" class="x">P15=1</button>
 <button data-c="P16=0" class="s">P16=0</button><button data-c="P16=1" class="x">P16=1</button>
</div>
<input id="cmd" placeholder="Своя команда, Enter - отправить (U:текст - в UART)">
<div id="log"></div>
<script>
const NUS='6e400001-b5a3-f393-e0a9-e50e24dcca9e',RX='6e400002-b5a3-f393-e0a9-e50e24dcca9e',TX='6e400003-b5a3-f393-e0a9-e50e24dcca9e';
let rx=null,dev=null;const log=t=>{const l=document.getElementById('log');l.textContent+=t;l.scrollTop=1e9};
async function connect(){
 try{
  dev=await navigator.bluetooth.requestDevice({filters:[{services:[NUS]}],optionalServices:[NUS]});
  dev.addEventListener('gattserverdisconnected',()=>{log('\n[отключено]\n');con.textContent='Подключиться к NB-BT'});
  const s=await(await dev.gatt.connect()).getPrimaryService(NUS);
  rx=await s.getCharacteristic(RX);
  const tx=await s.getCharacteristic(TX);
  await tx.startNotifications();
  tx.addEventListener('characteristicvaluechanged',e=>log(new TextDecoder().decode(e.target.value)));
  con.textContent='Подключено: '+dev.name;log('[подключено]\n');send('?');
 }catch(e){log('Ошибка: '+e+'\n')}
}
async function send(c){if(!rx){log('Сначала подключитесь\n');return}
 const d=new TextEncoder().encode(c);
 for(let i=0;i<d.length;i+=20)await rx.writeValueWithoutResponse(d.slice(i,i+20));}
const con=document.getElementById('con');con.onclick=connect;
document.querySelectorAll('button[data-c]').forEach(b=>b.onclick=()=>send(b.dataset.c));
document.getElementById('cmd').onkeydown=e=>{if(e.key==='Enter'){send(e.target.value);e.target.value=''}};
if(!navigator.bluetooth)log('Web Bluetooth недоступен: откройте в Chrome на Android (https или localhost)\n');
</script></body></html>
